[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biomodels"
authors = [
    {name = "Dane Deemer", email = "dane@liminalbios.com"},
]
description = "SQLModel database models for bioinformatics data"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.16",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/wintermutant/biomodels"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}
version = {attr = "biomodels.__version__"}

[tool.pytest.ini_options]                                                                                                               
log_cli = true                                                                                                                          
log_cli_level = "DEBUG"